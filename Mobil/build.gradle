buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Das Android-Gradle-Plugin, das Gradle beibringt, wie man Android-APKs baut
        classpath 'com.android.tools.build:gradle:8.11.2'
    }
}

apply plugin: 'com.android.application'

android {
    // Hier den Package-Namen aus Ihrer AndroidManifest.xml eintragen:
    namespace 'at.gaeckler.kasse'

    compileSdk 36

    defaultConfig {
        applicationId "at.gaeckler.kasse"
        minSdk 19
        targetSdk 36
        versionCode 2
        versionName "1.0.1"
        resValue "string", "app_version", versionName
    }

    sourceSets {
        main {
            // Sagt Gradle, dass die Dateiverzeichnisse aus dem alten ADT-Layout stammen:
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            resources.srcDirs = ['src']
            aidl.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}